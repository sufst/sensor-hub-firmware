ecu_name: Rear_Box

# Base IDs for the 11-bit standard CAN frames (0x000 - 0x7FF)
can_base_ids:
  analog:      0x690
  digital:     0x695
  i2c:         0x696
  status:      0x699
  temperature: 0x694

# Board-specific hardware overrides
hardware:
  error_led: PC15
  # Used for calculating timer prescaler/period values 
  clock_speed_hz: 72_000_000
  # Overrides the timer settings before the timer starts
  broadcast_period_ms: 20

# Channel Definitions
# id:              Physical label on the board (e.g., L1, R4)
# pin:             STM32 IC Pin name. Must correspond to an active ADC/GPIO
# vref:            Reference voltage for analog scaling (ignored if analog=false)
# enabled:         If false, the channel is completely omitted from codegen
# name:            Valid DBC identifier (no spaces, starts with letter)
# kind:             Channel kind: 'analog' (ADC) | 'digital' (GPIO) | 'pwm' | 'ntc-therm'
# series:          e.g. "1k", "4.7k", "10k", or "0", documentation only
# pullup:          e.g. "1k", "4.7k", "10k", or "NC", documentation only
# pulldown:        e.g. "1k", "4.7k", "10k", or "NC", documentation only
# cap:             e.g. "1u", "100n", or "NC", documentation only
channels:
  - { id: "L1", pin: "PB0", vref: 3.3, enabled: true,  name: "FAN_L_TACH",         kind: digital, series: "0",    pullup: "4.7k", pulldown: "NC", cap: "NC" }
  - { id: "L2", pin: "PC4", vref: 3.3, enabled: true,  name: "FAN_R_TACH",         kind: digital, series: "0",    pullup: "4.7k", pulldown: "NC", cap: "NC" }
  - { id: "L3", pin: "PB1", vref: 3.3, enabled: true,  name: "DAMPER_RL",          kind: analog,  series: "4.7k", pullup: "NC",   pulldown: "NC", cap: "1u" }
  - { id: "L4", pin: "PC5", vref: 3.3, enabled: true,  name: "DAMPER_RR",          kind: analog,  series: "4.7k", pullup: "NC",   pulldown: "NC", cap: "1u" }
  - { id: "L5", pin: "PA6", vref: 3.3, enabled: true,  name: "COOLANT_TEMP_L_IN",  kind: ntc-therm, series: "0",    pullup: "10k",  pulldown: "NC", cap: "NC" }
  - { id: "L6", pin: "PA5", vref: 3.3, enabled: true,  name: "COOLANT_TEMP_L_OUT", kind: ntc-therm, series: "0",    pullup: "10k",  pulldown: "NC", cap: "NC" }
  - { id: "L7", pin: "PA7", vref: 3.3, enabled: true,  name: "COOLANT_TEMP_R_IN",  kind: ntc-therm, series: "0",    pullup: "10k",  pulldown: "NC", cap: "NC" }
  - { id: "L8", pin: "PA4", vref: 3.3, enabled: true,  name: "COOLANT_TEMP_R_OUT", kind: ntc-therm, series: "0",    pullup: "10k",  pulldown: "NC", cap: "NC" }
  - { id: "R1", pin: "PC2", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R2", pin: "PC0", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R3", pin: "PC3", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R4", pin: "PC1", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R5", pin: "PA0", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R6", pin: "PA2", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R7", pin: "PA1", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }
  - { id: "R8", pin: "PA3", vref: 3.3, enabled: false, name: "unused", kind: digital, series: "NC",   pullup: "NC", pulldown: "NC", cap: "NC" }